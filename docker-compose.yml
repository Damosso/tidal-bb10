# Tidal-BB10 bridge. Works with `docker compose up -d` and with Portainer
# (Stacks > Add stack > Repository, pointing at this repository).
#
# Set BB_PASSWORD (Portainer: "Environment variables" on the stack page,
# docker compose: a .env file next to this one). It is required: anyone who
# can reach the port could otherwise stream on your TIDAL account.
services:
  tidal-bb10:
    build: ./server
    container_name: tidal-bb10
    restart: unless-stopped
    environment:
      BB_PASSWORD: ${BB_PASSWORD:?Set BB_PASSWORD to a long random password}
      TIDAL_QUALITY: ${TIDAL_QUALITY:-HIGH}   # LOW (96k AAC) | HIGH (320k AAC) | LOSSLESS (FLAC)
    ports:
      - "${PORT:-8686}:8686"
    volumes:
      - tidal-bb10-data:/data

volumes:
  tidal-bb10-data:
