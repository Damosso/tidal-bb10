<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Tidal-BB10</title>
<style>
* { -webkit-box-sizing: border-box; box-sizing: border-box; -webkit-tap-highlight-color: rgba(0,0,0,0); }
html, body { margin: 0; padding: 0; background: #0b0d10; color: #e9edf1;
  font-family: "Slate Pro", "Helvetica Neue", Helvetica, Arial, sans-serif; font-size: 15px; }
body { padding: 88px 0 86px 0; }
a { color: inherit; text-decoration: none; }

#top { position: fixed; top: 0; left: 0; right: 0; z-index: 5; background: #14181d; border-bottom: 1px solid #262c34; }
#tabs { height: 40px; }
#tabs a { float: left; width: 33.33%; height: 40px; line-height: 40px; text-align: center;
  color: #8b96a3; font-weight: bold; border-bottom: 3px solid transparent; }
#tabs a.on { color: #fff; border-bottom-color: #31d0c6; }
#searchform { padding: 6px 8px 8px 8px; margin: 0; }
#q { width: 100%; height: 34px; border: 1px solid #323a44; border-radius: 4px; background: #0b0d10;
  color: #fff; font-size: 16px; padding: 0 10px; outline: none; -webkit-appearance: none; }
#q:focus { border-color: #31d0c6; }

h1 { font-size: 19px; margin: 12px 10px 0 10px; }
.sub { color: #8b96a3; margin: 2px 10px 6px 10px; font-size: 13px; }
h2 { font-size: 12px; text-transform: uppercase; letter-spacing: 1px; color: #31d0c6;
  margin: 16px 10px 4px 10px; }
.msg { padding: 28px 16px; color: #8b96a3; text-align: center; line-height: 1.5; }
.msg b { color: #fff; font-size: 22px; letter-spacing: 2px; }

.row { display: block; position: relative; height: 56px; padding: 6px 10px 6px 64px;
  border-bottom: 1px solid #191e24; overflow: hidden; cursor: pointer; }
.row:active { background: #1b2128; }
.row.noimg { padding-left: 10px; }
.row.off { opacity: 0.35; }
.row.playing .t { color: #31d0c6; }
.row img, .row .ph { position: absolute; left: 10px; top: 6px; width: 44px; height: 44px;
  background: #1b2128; border-radius: 2px; }
.row.round img, .row.round .ph { border-radius: 22px; }
.row .t, .row .s { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row .t { font-size: 15px; line-height: 23px; padding-right: 44px; }
.row .s { font-size: 12px; line-height: 18px; color: #8b96a3; padding-right: 44px; }
.row .d { position: absolute; right: 10px; top: 19px; font-size: 12px; color: #6b7682; }
.row.big { height: 52px; line-height: 40px; font-size: 16px; padding-left: 14px; }
.more { display: block; margin: 12px 10px; height: 42px; line-height: 42px; text-align: center;
  background: #1b2128; border-radius: 4px; }

#player { position: fixed; left: 0; right: 0; bottom: 0; height: 78px; z-index: 5;
  background: #14181d; border-top: 1px solid #262c34; }
#bar { height: 14px; padding-top: 5px; background: #14181d; cursor: pointer; }
#bartrack { height: 4px; background: #2a313a; }
#barfill { height: 4px; width: 0; background: #31d0c6; }
#pimg { position: absolute; left: 8px; top: 20px; width: 50px; height: 50px; background: #1b2128; border-radius: 2px; }
#pinfo { position: absolute; left: 66px; right: 150px; top: 20px; }
#ptitle, #partist { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#ptitle { font-size: 14px; line-height: 20px; font-weight: bold; }
#partist { font-size: 12px; line-height: 16px; color: #8b96a3; }
#ptime { font-size: 11px; line-height: 14px; color: #6b7682; }
#ctl { position: absolute; right: 4px; top: 20px; width: 144px; height: 52px; }
#ctl a { float: left; width: 48px; height: 52px; line-height: 52px; text-align: center;
  font-size: 22px; color: #e9edf1; }
#ctl a:active { color: #31d0c6; }
#bplay { font-size: 28px !important; }
</style>
</head>
<body>

<div id="top">
  <div id="tabs">
    <a href="#home" id="tab-home">Home</a>
    <a href="#search" id="tab-search">Search</a>
    <a href="#my" id="tab-my">My music</a>
  </div>
  <form id="searchform" action="#">
    <input id="q" type="text" placeholder="Search Tidal" autocomplete="off" autocorrect="off" autocapitalize="off">
  </form>
</div>

<div id="view"><div class="msg">Loading…</div></div>

<div id="player">
  <div id="bar"><div id="bartrack"><div id="barfill"></div></div></div>
  <img id="pimg" alt="">
  <div id="pinfo">
    <div id="ptitle">Nothing playing</div>
    <div id="partist"></div>
    <div id="ptime"></div>
  </div>
  <div id="ctl">
    <a id="bprev">&#9198;</a>
    <a id="bplay">&#9654;</a>
    <a id="bnext">&#9197;</a>
  </div>
</div>

<audio id="audio" preload="auto"></audio>

<script>
(function () {
  'use strict';

  function $(id) { return document.getElementById(id); }
  var view = $('view'), audio = $('audio'), qbox = $('q');

  // Old BB10 fonts lack the media-control glyphs; use plain ASCII there.
  var plain = /BB10|BlackBerry/.test(navigator.userAgent);
  var G = plain ? { play: '&gt;', pause: '||', prev: '|&lt;', next: '&gt;|' }
                : { play: '&#9654;', pause: '&#10074;&#10074;', prev: '&#9198;', next: '&#9197;' };
  $('bprev').innerHTML = G.prev; $('bnext').innerHTML = G.next; $('bplay').innerHTML = G.play;

  function esc(s) {
    return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;')
      .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }
  function mmss(sec) {
    sec = Math.floor(sec || 0);
    var s = sec % 60;
    return Math.floor(sec / 60) + ':' + (s < 10 ? '0' : '') + s;
  }

  function api(method, url, cb) {
    var x = new XMLHttpRequest();
    x.open(method, url, true);
    x.onreadystatechange = function () {
      if (x.readyState !== 4) { return; }
      var data = null;
      try { data = JSON.parse(x.responseText); } catch (e) {}
      if (x.status >= 200 && x.status < 300 && data) { cb(null, data); }
      else { cb((data && data.error) || ('Server error ' + x.status)); }
    };
    x.send(null);
  }

  function message(html) { view.innerHTML = '<div class="msg">' + html + '</div>'; }

  // ---------- lists ----------

  var lists = [];      // track lists of the current view, one per section
  var loadSeq = 0;

  function rowHtml(it, li, ti) {
    var img = it.img ? '<img src="/cover/' + esc(it.img) + '" alt="">' : '<span class="ph"></span>';
    if (it.type === 'track') {
      return '<a class="row' + (it.ok ? '' : ' off') + '" data-l="' + li + '" data-i="' + ti +
        '" data-id="' + it.id + '">' + img + '<span class="t">' + esc(it.title) + '</span>' +
        '<span class="s">' + esc(it.artist) + (it.album ? ' · ' + esc(it.album) : '') + '</span>' +
        '<span class="d">' + mmss(it.duration) + '</span></a>';
    }
    var sub = it.type === 'artist' ? 'Artist' : (it.artist || '') + (it.year ? ' · ' + it.year : '');
    return '<a class="row' + (it.type === 'artist' ? ' round' : '') + '" href="#' + it.type + '/' +
      esc(it.id) + '">' + img + '<span class="t">' + esc(it.title) + '</span>' +
      '<span class="s">' + esc(sub) + '</span></a>';
  }

  function render(data, append) {
    var html = '', i, j, sec, li;
    if (!append) {
      lists = [];
      if (data.title) { html += '<h1>' + esc(data.title) + '</h1>'; }
      if (data.subtitle) { html += '<div class="sub">' + esc(data.subtitle) + '</div>'; }
    }
    var any = false;
    for (i = 0; i < data.sections.length; i++) {
      sec = data.sections[i];
      if (!sec.items.length) { continue; }
      any = true;
      if (sec.title) { html += '<h2>' + esc(sec.title) + '</h2>'; }
      if (append && lists.length) { li = lists.length - 1; } else { li = lists.length; lists.push([]); }
      for (j = 0; j < sec.items.length; j++) {
        if (sec.items[j].type === 'track') {
          lists[li].push(sec.items[j]);
          html += rowHtml(sec.items[j], li, lists[li].length - 1);
        } else {
          html += rowHtml(sec.items[j]);
        }
      }
    }
    if (!any && !append) { html += '<div class="msg">Nothing found.</div>'; }
    if (data.next) { html += '<a class="more" id="more" data-next="' + data.next + '">Load more</a>'; }
    var old = $('more');
    if (old) { old.parentNode.removeChild(old); }
    if (append) { view.insertAdjacentHTML('beforeend', html); }
    else { view.innerHTML = html; window.scrollTo(0, 0); }
    markPlaying();
  }

  function load(url) {
    var seq = ++loadSeq;
    message('Loading…');
    api('GET', url, function (err, data) {
      if (seq !== loadSeq) { return; }
      if (err) { message('Could not load this.<br>' + esc(err)); return; }
      render(data);
    });
  }

  view.onclick = function (ev) {
    var el = ev.target;
    while (el && el !== view && !(el.className && /\b(row|more)\b/.test(el.className))) { el = el.parentNode; }
    if (!el || el === view) { return; }
    if (el.id === 'more') {
      var base = route().join('/');
      el.innerHTML = 'Loading…';
      api('GET', '/api/' + base + '?offset=' + el.getAttribute('data-next'), function (err, data) {
        if (err) { el.innerHTML = 'Failed — tap to retry'; return; }
        render(data, true);
      });
      return;
    }
    var li = el.getAttribute('data-l');
    if (li !== null && lists[+li]) {
      queue = lists[+li].slice(0);
      playAt(+el.getAttribute('data-i'));
    }
  };

  // ---------- routing ----------

  function route() {
    var h = location.hash.replace(/^#/, '');
    return h ? h.split('/') : ['home'];
  }

  function show() {
    var r = route();
    var tab = (r[0] === 'my' || r[0] === 'search') ? r[0] : 'home';
    $('tab-home').className = tab === 'home' ? 'on' : '';
    $('tab-search').className = tab === 'search' ? 'on' : '';
    $('tab-my').className = tab === 'my' ? 'on' : '';
    $('searchform').style.display = tab === 'search' ? '' : 'none';
    document.body.style.paddingTop = tab === 'search' ? '88px' : '42px';
    if (r[0] === 'home') {
      load('/api/home');
    } else if (r[0] === 'search') {
      var q = r[1] ? decodeURIComponent(r.slice(1).join('/')) : '';
      if (q) { qbox.value = q; load('/api/search?q=' + encodeURIComponent(q)); }
      else { loadSeq++; message('Type something to search Tidal.'); }
    } else if (r[0] === 'my' && !r[1]) {
      loadSeq++;
      view.innerHTML = '<a class="row big noimg" href="#my/mixes">Mixes</a>' +
        '<a class="row big noimg" href="#my/playlists">Playlists</a>' +
        '<a class="row big noimg" href="#my/tracks">Tracks</a>' +
        '<a class="row big noimg" href="#my/albums">Albums</a>' +
        '<a class="row big noimg" href="#my/artists">Artists</a>';
    } else if (r[0] === 'my') {
      load('/api/my/' + encodeURIComponent(r[1]));
    } else if (r[0] === 'album' || r[0] === 'artist' || r[0] === 'playlist' || r[0] === 'mix') {
      load('/api/' + r[0] + '/' + encodeURIComponent(r[1]));
    } else {
      location.hash = '#home';
    }
  }

  $('searchform').onsubmit = function () {
    var q = qbox.value.replace(/^\s+|\s+$/g, '');
    if (q) {
      qbox.blur();
      var h = '#search/' + encodeURIComponent(q);
      if (location.hash === h) { show(); } else { location.hash = h; }
    }
    return false;
  };

  // ---------- player ----------

  var queue = [], pos = -1, fails = 0;

  function current() { return queue[pos] || null; }

  function markPlaying() {
    var cur = current(), rows = view.getElementsByTagName('a'), i, id;
    for (i = 0; i < rows.length; i++) {
      id = rows[i].getAttribute('data-id');
      if (id === null) { continue; }
      rows[i].className = rows[i].className.replace(/ playing/g, '') +
        (cur && String(cur.id) === id ? ' playing' : '');
    }
  }

  function playAt(i) {
    if (i < 0 || i >= queue.length) { return; }
    pos = i;
    var t = queue[i];
    if (!t.ok) { next(); return; }
    $('ptitle').innerHTML = esc(t.title);
    $('partist').innerHTML = esc(t.artist);
    $('ptime').innerHTML = '';
    $('barfill').style.width = '0';
    if (t.img) { $('pimg').src = '/cover/' + t.img; } else { $('pimg').removeAttribute('src'); }
    document.title = t.title + ' – ' + t.artist;
    audio.src = '/stream/' + t.id;
    audio.play();
    markPlaying();
  }

  function next() { if (pos + 1 < queue.length) { playAt(pos + 1); } }
  function prev() {
    if (audio.currentTime > 4 || pos <= 0) { audio.currentTime = 0; } else { playAt(pos - 1); }
  }
  function toggle() {
    if (!current()) { return; }
    if (audio.paused) { audio.play(); } else { audio.pause(); }
  }

  $('bnext').onclick = next;
  $('bprev').onclick = prev;
  $('bplay').onclick = toggle;

  audio.addEventListener('play', function () { $('bplay').innerHTML = G.pause; }, false);
  audio.addEventListener('pause', function () { $('bplay').innerHTML = G.play; }, false);
  audio.addEventListener('playing', function () { fails = 0; }, false);
  audio.addEventListener('ended', next, false);
  audio.addEventListener('error', function () {
    if (!current()) { return; }
    fails++;
    $('ptime').innerHTML = 'Could not play this track';
    if (fails < 3) { setTimeout(next, 800); }
  }, false);
  audio.addEventListener('timeupdate', function () {
    var cur = current();
    var d = audio.duration && isFinite(audio.duration) ? audio.duration : (cur ? cur.duration : 0);
    if (!d) { return; }
    $('barfill').style.width = Math.min(100, audio.currentTime / d * 100) + '%';
    $('ptime').innerHTML = mmss(audio.currentTime) + ' / ' + mmss(d);
  }, false);

  $('bar').onclick = function (ev) {
    var cur = current();
    var d = audio.duration && isFinite(audio.duration) ? audio.duration : (cur ? cur.duration : 0);
    if (!d) { return; }
    try { audio.currentTime = ev.clientX / window.innerWidth * d; } catch (e) {}
  };

  // Keyboard (the Classic has one): space = play/pause, n / p = next / previous.
  document.onkeydown = function (ev) {
    if (document.activeElement === qbox) { return; }
    var k = ev.keyCode;
    if (k === 32) { toggle(); return false; }
    if (k === 78) { next(); } else if (k === 80) { prev(); }
  };

  // ---------- login ----------

  function showLogin(login) {
    message('Connect your Tidal account.<br>On any phone or computer, open<br><br>' +
      '<a href="' + esc(login.url) + '" target="_blank" style="color:#31d0c6">link.tidal.com</a>' +
      '<br>and enter the code<br><br><b>' + esc(login.code) + '</b><br><br>' +
      'This page continues by itself once you are logged in.');
    setTimeout(boot, 3000);
  }

  function boot() {
    api('GET', '/api/status', function (err, st) {
      if (err) { message('Cannot reach the server.<br>' + esc(err)); setTimeout(boot, 5000); return; }
      if (st.loggedIn) { window.onhashchange = show; show(); return; }
      if (st.login) { showLogin(st.login); return; }
      api('POST', '/api/login', function (err2, r) {
        if (err2) { message('Tidal login could not start.<br>' + esc(err2)); setTimeout(boot, 5000); return; }
        if (r.loggedIn) { boot(); } else { showLogin(r.login); }
      });
    });
  }
  boot();
})();
</script>
</body>
</html>
